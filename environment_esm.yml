name: semper-esm

# ESM-C 600M sequence embeddings (semper/esm). Versions match the environment
# used to compute the embeddings for the paper.

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip

  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch==2.6.0
    - esm==3.2.1.post1
    - httpx==0.28.1            # imported by esm but not declared as a dependency
    - numpy==1.26.1
    - pandas==2.1.1
    - biopython==1.85
    - requests==2.32.3
    - tqdm==4.67.1

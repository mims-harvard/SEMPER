name: semper

# Network encoder pretraining, contrastive alignment, and evaluation.
# Versions match the environment used to train SEMPER for the paper.
# ESM-C embeddings are computed in a separate environment (environment_esm.yml).

channels:
  - conda-forge

dependencies:
  - python=3.8
  - pip

  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - --find-links https://data.pyg.org/whl/torch-2.1.0+cu118.html
    - setuptools<70            # umap-learn 0.5.3 imports pkg_resources
    - torch==2.1.0+cu118
    - torch-geometric==2.6.1
    - torch-scatter==2.1.2+pt21cu118
    - torch-sparse==0.6.18+pt21cu118
    - numpy==1.22.4
    - scipy==1.10.1
    - pandas==2.0.3
    - scikit-learn==1.3.0
    - statsmodels==0.14.1
    - networkx==3.1
    - scanpy==1.9.8
    - anndata==0.9.2
    - leidenalg==0.10.2
    - umap-learn==0.5.3
    - biopython==1.83
    - requests==2.32.3
    - tqdm==4.66.5
    - openpyxl==3.1.5
    - matplotlib==3.7.2
    - seaborn==0.13.2
    - plotly==5.24.1
    - wandb==0.19.1
    - obonet==1.1.0

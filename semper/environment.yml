name: semper
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip=23.0
  - pytorch=2.1.0
  - torchvision=0.16.0
  - pytorch-cuda=11.8
  - pytorch-mutex=1.0=cuda
  - numpy=1.24
  - scipy=1.11
  - pandas=2.0
  - scikit-learn=1.3
  - matplotlib=3.7
  - networkx=3.1
  - umap-learn=0.5.3
  - plotly=5.14
  - wandb=0.16
  - pip:
    - torch-geometric==2.6.1
    - torch-scatter==2.1.2+pt21cu118
    - torch-sparse==0.6.18+pt21cu118
    - torch-cluster==1.6.3+pt21cu118
    - pyg-lib==0.4.0+pt21cu118
    - esm==3.1.0